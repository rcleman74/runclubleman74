# Configuration de déploiement Netlify — Run Club Léman 74
# Site 100% statique (HTML/CSS, pas de build), servi tel quel depuis la racine du dépôt.
# La commande ci-dessous installe juste les dépendances des fonctions (@netlify/blobs)
# avant le déploiement, sinon Netlify ne les trouve pas au runtime.

[build]
  publish = "."
  command = "npm install --prefix netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[functions]
  directory = "netlify/functions"
